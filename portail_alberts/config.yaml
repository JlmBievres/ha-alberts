name: Portail Les Alberts
version: "0.2.4"
slug: portail_alberts
description: Portail voyageurs - pilotage des pièces, chauffage, météo, arrivée, départ et guide
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
watchdog: "tcp://[HOST]:[PORT:8099]"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Portail voyageurs (réseau local)
map:
  - addon_config:rw
options:
  guide_depot: ""
  guide_branche: main
  guide_heure: 4
schema:
  guide_depot: str?
  guide_branche: str
  guide_heure: int(0,23)
