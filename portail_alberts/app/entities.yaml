# Portail Les Alberts : description de la maison (format 3, application 0.3 « version simple »).
#
# Le portail ne peut agir QUE sur ce qui est décrit ici (liste blanche).
# Pour l'adapter sans toucher au dépôt : copier ce fichier dans
#   /addon_configs/<id>_portail_alberts/entities.yaml  (relu toutes les 10 s)
# puis vérifier http://<ip>:8099/sante : "entites_absentes" doit être vide.
#
# Ne JAMAIS décrire la prise de la box, des Pi ou du coordinateur Zigbee.
# Aucune donnée secrète ici : ce fichier est dans un dépôt public.

version: 3

seuils:
  humidite_max: 70          # % : alerte humidité
  temp_froide: 14           # °C : pièce froide
  temp_gel: 5               # °C : risque de gel
  temp_chauffe_attendue: 16 # °C : en Confort sous ce seuil sans consommer = « ne chauffe pas »
  puissance_min_chauffe: 10 # W

# Chauffage simplifié : 4 modes seulement (valeur Home Assistant -> libellé, sous-titre)
modes:
  Comfort: {libelle: "Confort", sous: "Journée", icone: soleil, aide: "La température réglée sur le radiateur. Pour une pièce occupée en journée."}
  ComfortMinus1: {libelle: "Nuit", sous: "−1 °C", icone: lune, aide: "Un degré de moins. Idéal pour dormir."}
  Eco: {libelle: "Éco", sous: "Absence", icone: feuille, aide: "Environ 3,5 °C de moins. Pour une absence de la journée."}
  FrostProtection: {libelle: "Hors-gel", sous: "Pièce fermée", icone: flocon, aide: "Environ 7 °C. Pour une pièce inoccupée."}
modes_chauffe: [Comfort, ComfortMinus1]
prechauffage: input_boolean.booleen_convecteur_tarif_nuit   # préchauffage heures creuses

# Ambiances d'éclairage (luminosité appliquée à toutes les lampes de la pièce)
ambiances:
  - {id: vive, nom: "Vive", pct: 100}
  - {id: douce, nom: "Douce", pct: 50}
  - {id: veilleuse, nom: "Veilleuse", pct: 15}

meteo:
  entite: weather.val_des_pres
  vigilance: sensor.05_weather_alert
  temperature_exterieure: sensor.capteur_exterieur_temperature
  soleil: sun.sun
  lieu: "Val-des-Prés"

# Portes d'entrée : capteurs d'ouverture (on/open = ouverte). Identifiants à renseigner.
portes: []
#  - {nom: "Haut", entite: binary_sensor.A_RENSEIGNER_porte_haut}
#  - {nom: "Bas", entite: binary_sensor.A_RENSEIGNER_porte_bas}

# Pièces. type : convecteur | poele | sans_chauffage | passage
#   porte : capteur(s) d'ouverture affiché(s) sur la carte (lecture seule) ; avec plusieurs
#           capteurs, la porte est « ouverte » dès que l'un d'eux l'indique
#   lampes : chaque lampe pilotable (light.* ou switch.*) ; minuterie_min : bouton « Allumer N min »
#   ventilation : entité + maintien (minutes) ; le portail la relance tant que dure le maintien
#   poele.prise : prise qui alimente le poêle (lecture seule, jamais coupée par le portail)
pieces:
  - id: sejour
    nom: Séjour
    type: poele
    temperature: sensor.capteur_sejour_temperature
    humidite: sensor.capteur_sejour_humidity
    poele: {prise: switch.prise_poele_salon_switch_3, puissance: sensor.prise_poele_salon_active_power_3}   # « Prise poele Séjour »
    lampes:
      - {id: plafonnier, nom: "Plafonnier, 4 ampoules", entite: light.sejour}
      - {id: entree, nom: "Lumière de l’entrée", entite: light.strip_entree_lumiere}
    porte: {nom: "Porte d’entrée haute", entite: [binary_sensor.ouverture_haut_ouverture, binary_sensor.ouverture_haut_ouverture_2]}

  - id: salon
    nom: Salon
    type: poele
    temperature: sensor.capteur_salon_temperature
    humidite: sensor.capteur_salon_humidity
    poele: {prise: switch.tz3000_2putqrmw_ts011f_switch, puissance: sensor.tz3000_2putqrmw_ts011f_active_power}   # « Prise Poele Salon »
    lampes:
      - {id: plafonnier, nom: "Plafonnier, 4 lampes", entite: light.salon}
      - {id: huego, nom: "Hue Go", entite: light.hue_go_1, alimentation: switch.prise_television_switch_3}
      - {id: bandeau, nom: "Bandeau du meuble", entite: light.hue_lightstrip_1, alimentation: switch.prise_television_switch_3}

  - id: meije
    nom: Chambre Meije
    type: convecteur
    temperature: sensor.capteur_ch_meije_temperature
    humidite: sensor.capteur_ch_meije_humidite
    convecteur:
      mode: select.convecteur_chambre_meije_mode_du_fil_pilote
      puissance: sensor.convecteur_chambre_meije_demande_instantanee
      interrupteur: switch.convecteur_chambre_meije
      energie: sensor.convecteur_chambre_meije_consommation
      modele: "À renseigner"
    lampes: []
    conseils:
      - "Le sélecteur du convecteur doit rester sur la position pilotée."
      - "Pour dormir, le mode Nuit suffit : la maison préchauffe en heures creuses."

  - id: ecrins
    nom: Chambre Écrins
    type: convecteur
    temperature: sensor.capteur_ch_parents_temperature   # À CONFIRMER : capteur « ch parents » = Écrins ?
    humidite: sensor.capteur_ch_parents_humidite
    convecteur:
      mode: select.convecteur_ecrins_mode_du_fil_pilote
      puissance: sensor.convecteur_ecrins_demande_instantanee
      interrupteur: switch.convecteur_ecrins
      energie: sensor.convecteur_ecrins_consommation
      modele: "À renseigner"
    lampes:
      - {id: chambre, nom: "Chambre", entite: light.chambre_a_coucher}
    conseils:
      - "Le sélecteur du convecteur doit rester sur la position pilotée."

  - id: refuge
    nom: Chambre Refuge
    type: sans_chauffage
    temperature: sensor.capteur_ch_refuge_temperature
    humidite: sensor.capteur_ch_refuge_humidite
    lampes:
      - {id: groupe, nom: "Toute la chambre", entite: light.chambre_refuge_groupe}
      - {id: bureau, nom: "Bandeau du bureau", entite: light.strip_bureau_light, alimentation: switch.prise_chauffe_eau_switch_3}
    conseils:
      - "Air sec : laissez la porte de la salle d'eau entrouverte après la douche."

  - id: entree
    nom: Entrée bas
    type: convecteur
    temperature: sensor.capteur_entree_temperature
    humidite: sensor.capteur_entree_humidite
    convecteur:
      mode: select.convecteur_entree_bas_mode_du_fil_pilote
      puissance: sensor.convecteur_entree_bas_demande_instantanee
      interrupteur: switch.convecteur_entree_bas
      energie: sensor.convecteur_entree_bas_consommation
      modele: "À renseigner"
    lampes: []
    porte: {nom: "Porte d’entrée basse", entite: [binary_sensor.ouverture_bas_ouverture, binary_sensor.ouverture_bas_ouverture_2]}

  - id: atelier
    nom: Atelier
    type: convecteur
    temperature: sensor.capteur_atelier_temperature
    humidite: sensor.capteur_atelier_humidity
    convecteur:
      mode: select.convecteur_atelier_mode_du_fil_pilote
      puissance: sensor.convecteur_atelier_demande_instantanee
      interrupteur: switch.convecteur_atelier
      energie: sensor.convecteur_atelier_consommation
      modele: "À renseigner"
    lampes: []
    conseils:
      - "Le chauffe-eau de la maison est dans l'atelier : laissez son accès dégagé."

  - id: sdb
    nom: Salle de bain cave
    type: convecteur
    temperature: sensor.capteur_sdbcave_temperature
    humidite: sensor.capteur_sdbcave_humidity
    convecteur:
      mode: select.convecteur_sdb_cave_mode_du_fil_pilote
      puissance: sensor.convecteur_sdb_cave_demande_instantanee
      interrupteur: switch.convecteur_sdb_cave
      energie: sensor.convecteur_sdb_cave_consommation
      modele: "À renseigner"
    lampes:
      - {id: plafonnier, nom: "Plafonnier", entite: light.salle_de_bain_cave}
    ventilation:
      entite: light.commande_vmc
      maintien_min: 30
      arret_auto: "S'arrête seule 5 min après l'extinction de la lumière."
    conseils:
      - "Bouton de gauche : un clic allume la lumière, double clic lance la ventilation."
      - "Bouton de droite : un clic éteint, la ventilation s'arrête 5 minutes après ; double clic arrête la ventilation."
      - "Pièce encore humide : maintenez la ventilation 30 min et laissez la porte ouverte."

  - id: douche
    nom: Douche étage
    type: sans_chauffage
    temperature: sensor.capteur_douche_etage_temperature
    humidite: sensor.capteur_douche_etage_humidity
    lampes: []                      # À RENSEIGNER si les ampoules sont pilotables
    conseils:
      - "Pas de ventilation mécanique à l'étage : après la douche, ouvrez la fenêtre quelques minutes et laissez la porte entrouverte."
      - "Raclez la paroi : l'eau est très calcaire."

  - id: escalier
    nom: Escalier
    type: passage
    lampes:
      - {id: escalier, nom: "Escalier", entite: light.escalier, minuterie_min: 10}
    conseils:
      - "La nuit, un détecteur allume au passage et éteint 2 minutes après le dernier mouvement."
      - "Boutons poussoirs : un clic pleine puissance, double clic demi-puissance, appui long extinction."

# État des prises : LECTURE SEULE (le portail ne les commande jamais).
# Les prises se pilotent depuis Home Assistant.
prises:
  - groupe: Chauffage
    prises:
      - {nom: "Poêle du séjour", entite: switch.prise_poele_salon_switch_3, puissance: sensor.prise_poele_salon_active_power_3}
      - {nom: "Poêle du salon", entite: switch.tz3000_2putqrmw_ts011f_switch, puissance: sensor.tz3000_2putqrmw_ts011f_active_power}
  - groupe: Eau chaude
    prises:
      - {nom: "Boîtier Tydom et bandeau du bureau", entite: switch.prise_chauffe_eau_switch_3}
      - {nom: "Chauffe-eau, mode nuit", entite: switch.atelier_chauffe_eau}
  - groupe: Internet et WiFi
    prises:
      - {nom: "WiFi de la Livebox", entite: switch.livebox_nautilus_wifi}
      - {nom: "WiFi tableau", entite: switch.prise_wi_fi_tableau_commutateur}
      - {nom: "WiFi séjour", entite: switch.prise_wi_fi_sejour_commutateur}
  - groupe: Éclairage et télévision
    prises:
      - {nom: "Pont Hue et télévision", entite: switch.prise_television_switch_3}
      - {nom: "Prise entrée haute", entite: switch.prise_entree_basse_switch}
      - {nom: "Prise entrée basse", entite: switch.prise_wi_fi_salon_commutateur}
  - groupe: Confort
    prises:
      - {nom: "Déshumidificateur", entite: switch.prise_deshumidificateur_switch_3}
      - {nom: "Extracteur salle de bain cave", entite: light.commande_vmc}
